{% extends 'admin_base.html' %}
{% load static %}
{% block content %}
<div class="container">
<h2 class="mb-4">Edit subjects</h2>
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}
<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label for="subject_name" class="form-label">subject Name</label>
        <input type="text" class="form-control" id="subject_name" name="subject_name" required placeholder="Enter subject name" value={{subject_obj.subject_name}}>
    </div>

    <div class="mb-3">
        <label for="subject_code" class="form-label">subject_code</label>
        <input type="text" class="form-control" id="subject_code" name="subject_code" required placeholder="Enter subject code" value={{subject_obj.subject_code}}>
    </div>
    <button type="submit" class="btn btn-success">Edit subject</button>
    
</form>
</div>


{% endblock %}
