{% extends 'admin_base.html' %}
{% load static %}
{% block content %}
<div class="container">
<h2 class="mb-4">Create Student Class</h2>
<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label for="class_name" class="form-label">Class Name</label>
        <input type="text" class="form-control" id="class_name" name="class_name" required placeholder="Enter class name">
        <small class="form-text text-muted">Enter the name of the class you want to create.</small>
    </div>

    <div class="mb-3">
        <label for="class_name_numeric" class="form-label">Class Name (Numeric)</label>
        <input type="text" class="form-control" id="class_name_numeric" name="class_name_numeric" required placeholder="Enter numeric class name">
        <small class="form-text text-muted">Enter the numeric name of the class you want to create.</small>
    </div>

    
    <div class="mb-3">
        <label for="Section" class="form-label">Section</label>
        <input type="text" class="form-control" id="Section" name="Section" required placeholder="Enter section">
        <small class="form-text text-muted">Enter the section of the class you want to create.</small>
    </div>

    <button type="submit" class="btn btn-success">Create Class</button>
    
</form>
</div>


{% endblock %}
