{% extends "admin_base.html" %}
{% load static %}
{% block content %}
    <h2 class="mb-4"> <i class="fas fa-techometer-alt"></i> Admin dashboard</h2>
    <div class="row g-4 ">
        <div class="col-md-6 col-lg-3">
            <a href="" class="text-decoration-none">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h3>{{total_student}}</h3>
                                <p>Registered Students</p>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

       <div class="col-md-6 col-lg-3">
            <a href="" class="text-decoration-none">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h3>{{total_subject}}</h3>
                                <p>Subject listings</p>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-3">
            <a href="" class="text-decoration-none">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h3>{{total_class}}</h3>
                                <p>Classes</p>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-lg-3">
            <a href="" class="text-decoration-none">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h3>{{total_result}}</h3>
                                <p>Results Declared</p>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
   
    <div class="mt-3">
        <img src="{% static 'images/background.png' %}" alt="Dashboard background" class="img-fluid" style="max-height: 500px; width: 4000px;">


    </div>
    {% endblock %}
